packages:
  - '.'

overrides:
  better-sqlite3: 13.0.1

# pnpm 11: allowBuilds 替代 onlyBuiltDependencies / ignoredBuiltDependencies
# pnpm 10 仍可读 onlyBuiltDependencies；双写以兼容本机与 CI
onlyBuiltDependencies:
  - better-sqlite3
  - '@prisma/engines'
  - prisma
  - sharp
  - unrs-resolver

allowBuilds:
  better-sqlite3: true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
